server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:market}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

market:
  jwt:
    secret: ${JWT_SECRET}
    expire-hours: ${JWT_EXPIRE_HOURS:72}
  upload:
    dir: /app/uploads
    base-url: /uploads
    max-size-bytes: 2097152
  payment:
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
    wechat-enabled: ${PAYMENT_WECHAT_ENABLED:true}
    alipay-enabled: ${PAYMENT_ALIPAY_ENABLED:true}
    sandbox-secret: ${PAYMENT_SANDBOX_SECRET:}

logging:
  level:
    root: info
    com.market: info
