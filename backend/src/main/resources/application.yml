server:
  port: 8082

spring:
  application:
    name: market-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: market
    password: market_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

market:
  jwt:
    secret: market-dev-secret-change-in-production-32chars
    expire-hours: 72
  upload:
    dir: uploads
    base-url: /uploads
    max-size-bytes: 2097152
  payment:
    mock-enabled: true
    wechat-enabled: true
    alipay-enabled: true
    sandbox-secret: dev-sandbox-secret

logging:
  level:
    com.market: debug
