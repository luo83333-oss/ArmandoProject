name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  docs-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Phase 0 artifacts
        run: |
          test -f docs/PRD-v0.1.md
          test -f docs/database/ER.md
          test -f backend/sql/V1__init_schema.sql
          test -f docker-compose.yml
          test -f docs/testing/E2E_TEST_CASES.md
          echo "Structure OK"

  backend-test:
    runs-on: ubuntu-latest
    needs: docs-and-structure
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Set up Maven
        uses: s4u/setup-maven-action@v3.1.0
        with:
          maven-version: 3.9.9
      - name: Start MySQL and Redis
        run: docker compose up -d mysql redis
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mysql mysqladmin ping -h localhost -uroot -pmarket_root_pass && break
            sleep 3
          done
      - name: Apply SQL migrations (V2+)
        run: |
          docker compose exec -T mysql mysql -umarket -pmarket_pass market < backend/sql/V2__add_user_role.sql
          if [ -f backend/sql/V3__product_gallery.sql ]; then
            docker compose exec -T mysql mysql -umarket -pmarket_pass market < backend/sql/V3__product_gallery.sql || true
          fi
      - name: Run backend tests
        working-directory: backend
        run: mvn -B test
